name: Fix sticky lesson stack

on:
  push:
    paths:
      - '.github/workflows/fix-sticky-lesson-stack.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep Lesson 1 sticky for the full stack
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          old_stack = '.lesson-stack { display: grid; grid-template-rows: repeat(2, max-content); align-items: start; gap: 34px; padding-bottom: 90px; }'
          new_stack = '''.lesson-stack {
      position: relative;
      display: block;
      padding-bottom: 120px;
    }
    .lesson-card + .lesson-card { margin-top: 34px; }'''

          if old_stack not in s:
              raise SystemExit('Current lesson-stack rule not found')

          s = s.replace(old_stack, new_stack, 1)
          s = s.replace('      align-self: start;\n', '', 1)
          s = s.replace('.lesson-card:nth-child(1) { z-index: 1; }', '.lesson-card:nth-child(1) { z-index: 1; }', 1)
          s = s.replace('.lesson-card:nth-child(2) { top: 194px; z-index: 2; }', '.lesson-card:nth-child(2) { top: 194px; z-index: 2; }', 1)

          p.write_text(s)
          PY

      - name: Remove workflow and commit final change
        run: |
          rm .github/workflows/fix-sticky-lesson-stack.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-sticky-lesson-stack.yml
          git commit -m "Keep Lesson 1 header visible through Lesson 2"
          git push
