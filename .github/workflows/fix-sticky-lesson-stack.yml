name: Fix sticky lesson stack

on:
  push:
    paths:
      - '.github/workflows/fix-sticky-lesson-stack.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update lesson stack CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '.lesson-stack { display: grid; gap: 34px; }'
          new = '''.lesson-stack {
      position: relative;
      display: block;
      padding-bottom: 120px;
    }
    .lesson-stack::before {
      content: "LESSON 01     GitHub Pages and a custom subdomain";
      position: sticky;
      z-index: 4;
      top: 110px;
      height: 84px;
      margin-bottom: -84px;
      padding: 0 clamp(24px,4vw,52px);
      display: flex;
      align-items: center;
      border-radius: 42px 42px 0 0;
      color: #fff;
      background: linear-gradient(135deg,#ff3158,#ff6a2a 48%,#f9b61b);
      box-shadow: 0 18px 45px rgba(28,24,85,.18);
      font-size: clamp(.82rem,1.4vw,1.02rem);
      font-weight: 900;
      letter-spacing: .01em;
      white-space: pre;
    }
    .lesson-card + .lesson-card { margin-top: 34px; }'''
          if old not in s:
              raise SystemExit('Target lesson-stack rule not found')
          s = s.replace(old, new, 1)
          s = s.replace('.lesson-card:nth-child(2) { top: 184px; }', '.lesson-card:nth-child(2) { top: 194px; z-index: 5; }', 1)
          p.write_text(s)
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/fix-sticky-lesson-stack.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-sticky-lesson-stack.yml
          git commit -m "Keep Lesson 1 header visible throughout Lesson 2"
          git push

# Trigger the one-time correction after the workflow exists on main.
