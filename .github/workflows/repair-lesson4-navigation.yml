name: Repair Lesson 4 navigation

on:
  push:
    paths:
      - .github/workflows/repair-lesson4-navigation.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct Lesson 4 links
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lesson4/index.html')
          text = path.read_text(encoding='utf-8')

          old_sidebar = '<a class="journal-signup-trigger" href="https://swe.tickerbell.biz/?journal-signup=1">Subscribe for Lesson 5 →</a>'
          new_sidebar = '<a href="https://swe.tickerbell.biz/lesson5/">Continue to Lesson 5 →</a>'
          old_closing = '<a class="button journal-signup-trigger" href="https://swe.tickerbell.biz/?journal-signup=1">Get future lessons →</a>'
          new_closing = '<a class="button" href="https://swe.tickerbell.biz/lesson5/">Continue to Lesson 5 →</a>'
          old_footer = '<li><a href="https://swe.tickerbell.biz/lesson4/">Lesson 4</a></li></ul>'
          new_footer = '<li><a href="https://swe.tickerbell.biz/lesson4/">Lesson 4</a></li><li><a href="https://swe.tickerbell.biz/lesson5/">Lesson 5</a></li><li><a href="https://swe.tickerbell.biz/lesson6/">Lesson 6</a></li></ul>'

          for old, new in ((old_sidebar, new_sidebar), (old_closing, new_closing), (old_footer, new_footer)):
              if old not in text:
                  raise SystemExit(f'Expected text not found: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit corrected page
        run: |
          rm .github/workflows/repair-lesson4-navigation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lesson4/index.html .github/workflows/repair-lesson4-navigation.yml
          git commit -m "Connect Lesson 4 to Lesson 5"
          git push
