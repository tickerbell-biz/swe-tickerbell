<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ticker Bell Software Engineering — learning, building, and shipping well-crafted software.">
  <title>Ticker Bell SWE | Software Engineering</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b14;
      --surface: #111728;
      --text: #f7f8fc;
      --muted: #aeb7ca;
      --accent: #8b5cf6;
      --accent-2: #22d3ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(139, 92, 246, .22), transparent 32rem),
        radial-gradient(circle at 85% 80%, rgba(34, 211, 238, .14), transparent 28rem),
        var(--bg);
    }
    nav, main, footer { width: min(1120px, calc(100% - 40px)); margin-inline: auto; }
    nav {
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { font-weight: 800; letter-spacing: -.03em; }
    .brand span { color: var(--accent-2); }
    nav a, .button {
      color: var(--text);
      text-decoration: none;
    }
    nav a { color: var(--muted); }
    main {
      min-height: calc(100vh - 158px);
      display: grid;
      align-content: center;
      padding: 72px 0 110px;
    }
    .eyebrow {
      color: var(--accent-2);
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 900px;
      margin: 18px 0 24px;
      font-size: clamp(3.4rem, 9vw, 7.5rem);
      line-height: .93;
      letter-spacing: -.065em;
    }
    h1 em {
      font-style: normal;
      background: linear-gradient(100deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .intro {
      max-width: 680px;
      margin: 0 0 36px;
      color: var(--muted);
      font-size: clamp(1.05rem, 2vw, 1.3rem);
      line-height: 1.65;
    }
    .button {
      display: inline-flex;
      width: fit-content;
      padding: 14px 20px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px;
      background: rgba(255,255,255,.07);
      font-weight: 750;
      transition: transform .2s ease, background .2s ease;
    }
    .button:hover { transform: translateY(-2px); background: rgba(255,255,255,.12); }
    footer {
      min-height: 70px;
      color: var(--muted);
      font-size: .9rem;
    }
  </style>
</head>
<body>
  <nav>
    <div class="brand">Ticker Bell <span>SWE</span></div>
    <a href="https://tickerbell.biz">Ticker Bell ↗</a>
  </nav>
  <main>
    <div class="eyebrow">Software Engineering</div>
    <h1>Learn deeply.<br><em>Build boldly.</em></h1>
    <p class="intro">A practical software-engineering journey by Ticker Bell—turning ideas into reliable, thoughtfully crafted digital products.</p>
    <a class="button" href="mailto:admin@mehr.gallery">Coming soon — contact us</a>
  </main>
  <footer>© 2026 Ticker Bell Kft. Budapest.</footer>
</body>
</html>
